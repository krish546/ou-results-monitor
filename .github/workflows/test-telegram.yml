name: Test Telegram

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          message = """🔔 OU Results Monitor Test

Your Telegram notification system is working successfully.

When Osmania University publishes a new examination result, you will receive an alert here."""

          response = requests.post(
              url,
              data={
                  "chat_id": chat_id,
                  "text": message
              },
              timeout=30
          )

          response.raise_for_status()

          print("Telegram message sent successfully!")
          PY
